<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mtaani Academy | Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D0B2B;
    --navy-soft:#171438;
    --cyan:#38B6FF;
    --purple:#9B59B6;
    --paper:#F7F8FC;
    --card:#FFFFFF;
    --line:#E7E9F5;
    --text:#1B1A2E;
    --muted:#6E7191;
    --danger:#E14B4B;
    --danger-bg:#FDECEC;
    --success:#22B07D;
    --success-bg:#E7F8F1;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy) 220px, var(--paper) 220px);
    color:var(--text);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  a{text-decoration:none;color:inherit;}

  .wrap{max-width:420px;margin:0 auto;padding:0 20px 40px;}

  .brand-row{
    display:flex;align-items:center;gap:10px;
    padding:34px 0 10px;
  }
  .brand-mark{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg,var(--cyan),var(--purple));
    display:flex;align-items:center;justify-content:center;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;color:#fff;
  }
  .brand-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;color:#fff;}
  .brand-name span{color:var(--cyan);}
  .subtitle{color:#B9B8D6;font-size:13.5px;padding-bottom:20px;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 20px;margin-top:20px;
    box-shadow:0 20px 40px -20px rgba(13,11,43,0.25);
  }
  .card h2{font-size:18px;color:var(--navy);margin-bottom:4px;}
  .card .lead{font-size:13px;color:var(--muted);margin-bottom:20px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--navy);margin-bottom:6px;}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:12px 13px;font-size:14px;font-family:'Inter',sans-serif;
    background:var(--paper);
  }
  .field input:focus{outline:2px solid var(--cyan);outline-offset:1px;border-color:transparent;}

  .msg{
    font-size:12.5px;border-radius:10px;padding:10px 12px;margin-bottom:14px;display:none;
  }
  .msg.error{display:block;background:var(--danger-bg);color:var(--danger);}
  .msg.success{display:block;background:var(--success-bg);color:var(--success);}

  .submit-btn{
    width:100%;background:var(--navy);color:#fff;font-weight:700;font-size:14.5px;
    padding:13px;border-radius:11px;margin-top:6px;
  }
  .submit-btn:disabled{opacity:0.6;}

  .forgot-link{
    display:block;text-align:center;font-size:13px;color:var(--cyan);font-weight:600;
    margin-top:16px;
  }

  .support-row{
    text-align:center;margin-top:26px;font-size:12.5px;color:var(--muted);
  }
  .support-row a{color:var(--navy);font-weight:700;}

  #authGate{
    position:fixed;inset:0;background:var(--navy);z-index:100;
    display:flex;align-items:center;justify-content:center;
    color:#B9B8D6;font-size:13px;
  }
</style>
</head>
<body>

<div id="authGate">Checking your session...</div>

<div class="wrap" id="loginWrap" style="visibility:hidden;">
  <div class="brand-row">
    <div class="brand-mark">MA</div>
    <div class="brand-name">Mtaani <span>Academy</span></div>
  </div>
  <div class="subtitle">Build real websites and digital systems, at your own pace.</div>

  <div class="card">
    <h2>Welcome back</h2>
    <p class="lead">Log in to continue where you left off.</p>

    <div class="msg" id="formMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Log in</button>
    </form>

    <a href="#" class="forgot-link" id="forgotLink">Forgot password or logging in for the first time?</a>
  </div>

  <div class="support-row">
    Need help getting in? <a href="#" id="waHelp" target="_blank">Message us on WhatsApp</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAEUzLrFYG3bWl1FQs_FK-7Z3_T3T90e9c",
  authDomain: "mtaani-academy.firebaseapp.com",
  projectId: "mtaani-academy",
  storageBucket: "mtaani-academy.firebasestorage.app",
  messagingSenderId: "17985177635",
  appId: "1:17985177635:web:73e9184ea1816f52870996"
};

const ADMIN_EMAIL = "mtaaniweb@gmail.com";
const WHATSAPP_NUMBER = "254715392010";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const authGate = document.getElementById("authGate");
const loginWrap = document.getElementById("loginWrap");
const formMsg = document.getElementById("formMsg");
const loginForm = document.getElementById("loginForm");
const submitBtn = document.getElementById("submitBtn");

function routeFor(email){
  return email === ADMIN_EMAIL ? "/admin/" : "/userdashboard/";
}

function showMsg(type, text){
  formMsg.className = "msg " + type;
  formMsg.textContent = text;
}

function clearMsg(){
  formMsg.className = "msg";
  formMsg.textContent = "";
}

// If a session already exists, skip the form entirely and route straight in.
setPersistence(auth, browserLocalPersistence).then(() => {
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = routeFor(user.email);
      return;
    }
    authGate.style.display = "none";
    loginWrap.style.visibility = "visible";
  });
});

loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearMsg();

  const email = document.getElementById("emailInput").value.trim();
  const password = document.getElementById("passwordInput").value;

  submitBtn.disabled = true;
  submitBtn.textContent = "Logging in...";

  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    window.location.href = routeFor(cred.user.email);
  } catch (err) {
    submitBtn.disabled = false;
    submitBtn.textContent = "Log in";
    if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found") {
      showMsg("error", "That email and password do not match. Check for typos or use forgot password below.");
    } else if (err.code === "auth/invalid-email") {
      showMsg("error", "Enter a valid email address.");
    } else if (err.code === "auth/too-many-requests") {
      showMsg("error", "Too many attempts. Wait a few minutes and try again.");
    } else {
      showMsg("error", "Something went wrong logging in. Try again in a moment.");
    }
  }
});

document.getElementById("forgotLink").addEventListener("click", async (e) => {
  e.preventDefault();
  clearMsg();

  const email = document.getElementById("emailInput").value.trim();
  if (!email) {
    showMsg("error", "Type your email above first, then tap this link again.");
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showMsg("success", "Check your email for a link to set your password.");
  } catch (err) {
    if (err.code === "auth/user-not-found") {
      showMsg("error", "We do not have an account under that email. Message us on WhatsApp if this seems wrong.");
    } else if (err.code === "auth/invalid-email") {
      showMsg("error", "Enter a valid email address.");
    } else {
      showMsg("error", "Could not send the reset email. Try again in a moment.");
    }
  }
});

const waMsg = encodeURIComponent("Hello Mtaani Academy, I need help logging in.");
document.getElementById("waHelp").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${waMsg}`;
</script>
</body>
</html>
